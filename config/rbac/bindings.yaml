apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: raspberrypi-operator-manager
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: raspberrypi-operator-manager
subjects:
  - kind: ServiceAccount
    name: raspberrypi-operator-manager
    namespace: raspberrypi-operator-system
---
# The agent reads NodeBootloaders, writes their status, and creates its own
# node's (empty, Unmanaged) object when it starts. It reads its Node to own the
# object it creates.
# NOTE: RBAC cannot restrict an agent to its own node's object, so the admission
# policy in config/policy does: a compromised node could otherwise create or
# report on another node's object. See docs/design.md.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: raspberrypi-operator-agent
rules:
  - apiGroups: ["rpi.conall.dev"]
    resources: ["nodebootloaders"]
    verbs: ["get", "list", "watch", "create"]
  - apiGroups: ["rpi.conall.dev"]
    resources: ["nodebootloaders/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: raspberrypi-operator-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: raspberrypi-operator-agent
subjects:
  - kind: ServiceAccount
    name: raspberrypi-operator-agent
    namespace: raspberrypi-operator-system
---
# Leader election.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: raspberrypi-operator-leader-election
  namespace: raspberrypi-operator-system
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: raspberrypi-operator-leader-election
  namespace: raspberrypi-operator-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: raspberrypi-operator-leader-election
subjects:
  - kind: ServiceAccount
    name: raspberrypi-operator-manager
    namespace: raspberrypi-operator-system
