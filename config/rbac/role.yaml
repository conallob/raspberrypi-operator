---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: raspberrypi-operator-manager
rules:
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - ""
  resources:
  - nodes
  verbs:
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - get
  - list
- apiGroups:
  - ""
  resources:
  - pods/eviction
  verbs:
  - create
- apiGroups:
  - apps
  resources:
  - daemonsets
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - rpi.conallob.dev
  resources:
  - bootloaderpolicies
  verbs:
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - rpi.conallob.dev
  resources:
  - bootloaderpolicies/finalizers
  verbs:
  - update
- apiGroups:
  - rpi.conallob.dev
  resources:
  - bootloaderpolicies/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - rpi.conallob.dev
  resources:
  - nodebootloaders
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
