apiVersion: v1
kind: Namespace
metadata:
  name: raspberrypi-operator-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: raspberrypi-operator-manager
  namespace: raspberrypi-operator-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: raspberrypi-operator
      app.kubernetes.io/component: manager
  template:
    metadata:
      labels:
        app.kubernetes.io/name: raspberrypi-operator
        app.kubernetes.io/component: manager
    spec:
      serviceAccountName: raspberrypi-operator-manager
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: ghcr.io/conallob/raspberrypi-operator:latest
          command: ["/manager"]
          args: ["--leader-elect"]
          ports:
            - {name: metrics, containerPort: 8080}
            - {name: probes, containerPort: 8081}
          livenessProbe:
            httpGet: {path: /healthz, port: probes}
          readinessProbe:
            httpGet: {path: /readyz, port: probes}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: {cpu: 10m, memory: 64Mi}
            limits: {memory: 256Mi}
