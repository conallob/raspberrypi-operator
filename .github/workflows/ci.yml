name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Generated code is up to date
        run: make verify-generated
      - run: make vet
      - name: Test with coverage
        run: make cover
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage.out
          token: ${{ secrets.CODECOV_TOKEN }}
          # Don't fail the build on a Codecov outage or before the repo is set up
          # there; the coverage gate itself is codecov.yml's status checks.
          fail_ci_if_error: false
      - name: Cross-compile agent for the Pi
        run: make build
      # The prebuilt golangci-lint release is built with an older Go than this
      # module targets and refuses to lint it, so build it with the module's
      # toolchain instead.
      - name: Lint
        run: make lint
