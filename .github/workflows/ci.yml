name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Generated code is up to date
        run: make verify-generated
      - run: make vet
      - run: make test
      - name: Cross-compile agent for the Pi
        run: make build
      # The prebuilt golangci-lint release is built with an older Go than this
      # module targets and refuses to lint it, so build it with the module's
      # toolchain instead.
      - name: Lint
        run: make lint
